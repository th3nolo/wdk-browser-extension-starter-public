name: secret-scan

# Verifies that no secret is ever committed — across the FULL git history, not just
# the latest diff. Runs on every push/PR, on demand, and on a weekly sweep.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Industry-standard scanner with entropy detection + a large ruleset. Free for
      # public/personal repos (a GITLEAKS_LICENSE is only required for org accounts).
      - name: gitleaks (full git history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Wallet-specific second layer: checksum-validated BIP-39 seed phrases and hex
      # private keys, which generic scanners miss.
      - name: Wallet-specific full-history secret scan
        run: pnpm run verify:secrets:history
