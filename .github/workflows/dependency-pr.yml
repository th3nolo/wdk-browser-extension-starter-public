name: Dependency PR gate

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout event commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Release dependency gate
        uses: ./.github/actions/dependency-gate

      - name: Fetch base branch
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$GITHUB_BASE_REF"

      - name: Lockfile PR policy
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: pnpm run smoke:lockfile -- --pr-policy

      - name: Review resolved lockfile versions
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: pnpm run review:lockfile -- --pr-review