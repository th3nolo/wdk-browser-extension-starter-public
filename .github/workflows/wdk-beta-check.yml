name: WDK beta bump

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate

      - name: Setup pnpm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply WDK beta bump when available
        id: wdk
        run: node scripts/check-wdk-beta.mjs --apply

      - name: Verify dependency gates
        if: steps.wdk.outputs.updated == 'true'
        run: pnpm run verify:ci

      - name: Create pull request
        if: steps.wdk.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: deps/wdk-beta-${{ steps.wdk.outputs.version }}
          delete-branch: true
          commit-message: Bump WDK packages to ${{ steps.wdk.outputs.version }}
          title: Bump WDK packages to ${{ steps.wdk.outputs.version }}
          body: |
            Automated WDK beta alignment.

            - Bumps all direct `@tetherto/wdk*` packages and the nested `@tetherto/wdk-wallet` override together
            - Evaluates the reviewed advisory policy; never creates or expands exceptions
            - Passed `pnpm run verify:ci` before opening this PR

            Use this workflow for an aligned WDK bump. Unreviewed or critical advisories block verification.

            Review the resolved lockfile diff and reviewed advisory policy before merging.
          labels: dependencies
