name: CI

on:
  push:
    branches: [master]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Release validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout event commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Release dependency gate
        id: dependencies
        uses: ./.github/actions/dependency-gate

      - name: Install audited dependencies with approved build scripts
        run: pnpm install --frozen-lockfile

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$GITHUB_BASE_REF"

      - name: Lockfile PR policy
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: pnpm run smoke:lockfile -- --pr-policy

      - name: Review resolved lockfile versions
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: pnpm run review:lockfile -- --pr-review

      - name: Run CI verifier
        id: verify
        run: pnpm run verify:ci

      - name: Verify build preserved audited sources and lockfile
        run: git diff --exit-code HEAD --

      - name: Upload extension package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success() && steps.dependencies.outcome == 'success' && steps.verify.outcome == 'success'
        with:
          name: wdk-browser-extension-starter-chrome-${{ github.sha }}
          path: |
            .output/chrome-mv3
            .output/*.zip
          # The validated build paths are inside the hidden .output directory.
          include-hidden-files: true
          if-no-files-found: error
