packages:
  - .

minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # These versions are already pinned by the pre-migration npm lockfile and older than 72 hours.
  # Keep exceptions version-specific so future transitive updates still hit the trust gate.
  - "undici-types@6.21.0 || 6.19.8"
  - "vite@5.4.21"
  - "@webext-core/isolated-element@1.1.5"
  - "semver@6.3.1"
  - "bare-fetch@2.9.1"
  - "tinyexec@1.2.2"
overrides:
  "@tetherto/wdk-wallet": 1.0.0-beta.17
  # Security fixes restricted to the affected API families and consumers.
  "node-notifier>uuid": 11.1.1
  "fx-runner>shell-quote": 1.10.0
  "web-ext-run>tmp": 0.2.7
  "firefox-profile>adm-zip": 0.6.1
  "wxt>esbuild": 0.28.1
  "vite@8": 8.0.16
  "vite@6": 6.4.3
  "undici@7": 7.29.1
  "js-yaml@4": 4.3.2
  "protobufjs@7": 7.6.6
  "brace-expansion@1": 1.1.18
  "brace-expansion@5": 5.0.9
  "postcss@8": 8.5.23
  "nanoid@3": 3.3.18
  "@opentelemetry/core@2": 2.8.0
packageExtensions:
  "@bitcoinerlab/descriptors@3.1.7":
    dependencies:
      # descriptors-core requires v2; keep the application's v1 crypto pin intact.
      "@noble/hashes": 2.2.0
allowBuilds:
  esbuild: true
  protobufjs: true
  secp256k1: true
  spawn-sync: true
